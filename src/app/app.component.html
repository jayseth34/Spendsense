<div class="shell">
  <aside class="sidebar no-print">
    <a routerLink="/dashboard" class="brand">
      <span class="brand-mark">S</span>
      <span>SpendSense</span>
    </a>
    <a routerLink="/expense/new" class="btn primary full add-btn">＋ Add expense</a>
    <nav>
      <a *ngFor="let n of nav" [routerLink]="n.path" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true">{{ n.icon }}</span>{{ n.label }}
      </a>
    </nav>
    <p class="sidebar-foot">Stored privately on this device.</p>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav no-print">
    <a *ngFor="let p of mobileMain.slice(0, 2)" [routerLink]="p" routerLinkActive="active" (click)="moreOpen = false">
      <span aria-hidden="true">{{ item(p).icon }}</span>{{ item(p).label }}
    </a>
    <a routerLink="/expense/new" class="fab" aria-label="Add expense" (click)="moreOpen = false">＋</a>
    <a [routerLink]="mobileMain[2]" routerLinkActive="active" (click)="moreOpen = false">
      <span aria-hidden="true">{{ item(mobileMain[2]).icon }}</span>{{ item(mobileMain[2]).label }}
    </a>
    <button type="button" [class.active]="moreOpen" (click)="moreOpen = !moreOpen" [attr.aria-expanded]="moreOpen">
      <span aria-hidden="true">⋯</span>More
    </button>
  </nav>
  <div class="more-backdrop no-print" *ngIf="moreOpen" (click)="moreOpen = false"></div>
  <div class="more-sheet no-print" *ngIf="moreOpen">
    <a *ngFor="let n of moreItems" [routerLink]="n.path" routerLinkActive="active" (click)="moreOpen = false">
      <span class="nav-icon" aria-hidden="true">{{ n.icon }}</span>{{ n.label }}
    </a>
  </div>

  <div class="toasts" aria-live="polite">
    <div class="toast" *ngFor="let t of toast.toasts$ | async">
      <span>{{ t.text }}</span>
      <button *ngIf="t.action as a" type="button" (click)="run(t.id, a.run)">{{ a.label }}</button>
    </div>
  </div>
</div>
